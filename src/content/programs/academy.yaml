# Pricing is never shown on Academy pages. Kept for internal reference.
cost: 3400
unit: per year
costNote: Travel, hotels and event entry billed separately. Need-based financial aid available.
includes:
  - Year-round coaching, 4–5 sessions a week
  - League and national platform fees
  - Full training and match kit
  - Strength, conditioning and mental performance
  - Film review and individual development plans

commit: 4–5× / week
commitNote: Eleven-month season with regional and national travel. Expect 3–5 travel weekends per year.

